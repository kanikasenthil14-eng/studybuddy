<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Partnerships - Study Buddy Matcher</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<nav class="navbar">
    <a class="brand" href="/"><span>📚</span> Study Buddy Matcher</a>
    <div class="nav-links">
        <a href="/">Home</a><a href="/students">Students</a>
        <a href="/matches/search">Find Partners</a><a href="/requests/select">Requests</a>
    </div>
</nav>
<div class="container">

    <!-- If no student selected, show selector -->
    <div th:if="${student == null or student.studentId == 0}">
        <div class="page-header"><h1>🤝 Partnerships</h1></div>
        <div class="card">
            <div class="card-title">Select Your Profile</div>
            <form action="/requests/partnerships" method="get" style="display:flex;gap:.75rem;flex-wrap:wrap;align-items:flex-end;">
                <div class="form-group" style="flex:1;min-width:200px;margin-bottom:0;">
                    <select name="studentId" class="form-control" required>
                        <option value="">-- Select student --</option>
                        <option th:each="s : ${students}" th:value="${s.studentId}"
                                th:text="${s.studentName} + ' (' + ${s.department} + ')'"></option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary" style="margin-bottom:0;">View Partnerships</button>
            </form>
        </div>
    </div>

    <div th:unless="${student == null or student.studentId == 0}">
        <div class="page-header">
            <h1>🤝 Partnerships — <span th:text="${student.studentName}"></span></h1>
            <div style="display:flex;gap:.5rem;flex-wrap:wrap;">
                <a th:href="@{/requests/incoming(studentId=${student.studentId})}" class="btn btn-outline btn-sm">Incoming</a>
                <a th:href="@{/requests/sent(studentId=${student.studentId})}"     class="btn btn-outline btn-sm">Sent</a>
                <a href="/requests/select" class="btn btn-outline btn-sm">← Change Student</a>
            </div>
        </div>

        <div th:if="${successMessage}" class="alert alert-success" data-auto-dismiss th:text="${successMessage}"></div>
        <div th:if="${errorMessage}"   class="alert alert-danger"  data-auto-dismiss th:text="${errorMessage}"></div>

        <div class="card" th:if="${partnerships.isEmpty()}">
            <div class="empty-state">
                <div class="empty-icon">🤝</div>
                <p>No active partnerships yet.</p>
                <a href="/matches/search" class="btn btn-primary">Find Study Partners</a>
            </div>
        </div>

        <div class="card" th:unless="${partnerships.isEmpty()}">
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr><th>Partner</th><th>Subject</th><th>Request ID</th><th>Date</th><th>Status</th><th>Actions</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="r : ${partnerships}">
                            <td th:text="${r.requesterId == student.studentId} ? ${r.receiverName} : ${r.requesterName}"></td>
                            <td th:text="${r.subjectName}"></td>
                            <td th:text="${r.requestId}"></td>
                            <td th:text="${#temporals.format(r.requestTime, 'dd MMM yyyy')}"></td>
                            <td>
                                <span th:class="'badge badge-' + ${r.status.toLowerCase()}" th:text="${r.status}"></span>
                            </td>
                            <td>
                                <form th:if="${r.status == 'ACCEPTED'}"
                                      th:action="@{/requests/{id}/complete(id=${r.requestId})}" method="post"
                                      style="display:inline;" data-confirm="Mark this partnership as completed?">
                                    <input type="hidden" name="studentId" th:value="${student.studentId}"/>
                                    <button type="submit" class="btn btn-info btn-sm">Mark Complete</button>
                                </form>
                                <span th:unless="${r.status == 'ACCEPTED'}" style="color:#94a3b8; font-size:.85rem;">Completed</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
<footer>Study Buddy Matcher &mdash; DBMS Final Project</footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
