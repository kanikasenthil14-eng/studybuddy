<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Select Student - Study Buddy Matcher</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<nav class="navbar">
    <a class="brand" href="/"><span>📚</span> Study Buddy Matcher</a>
    <div class="nav-links">
        <a href="/">Home</a><a href="/students">Students</a>
        <a href="/matches/search">Find Partners</a><a href="/requests/select">Requests</a>
    </div>
</nav>
<div class="container">
    <div class="page-header"><h1>📨 Manage Requests</h1></div>

    <div class="card">
        <div class="card-title">Select Your Profile</div>
        <p style="color:#64748b; margin-bottom:1rem; font-size:.9rem;">
            Choose your student profile to view and manage your study requests.
        </p>

        <div th:if="${students.isEmpty()}" class="empty-state">
            <div class="empty-icon">👥</div>
            <p>No students registered yet.</p>
            <a href="/students/register" class="btn btn-primary">Register Student</a>
        </div>

        <div th:unless="${students.isEmpty()}">
            <form action="/requests/incoming" method="get" style="display:flex; gap:.75rem; flex-wrap:wrap; align-items:flex-end;">
                <div class="form-group" style="flex:1; min-width:200px; margin-bottom:0;">
                    <label for="studentId">Student Profile</label>
                    <select id="studentId" name="studentId" class="form-control" required>
                        <option value="">-- Select --</option>
                        <option th:each="s : ${students}" th:value="${s.studentId}"
                                th:text="${s.studentName} + ' (' + ${s.department} + ')'"></option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary" style="margin-bottom:0;">View Incoming</button>
            </form>

            <form action="/requests/sent" method="get" style="display:flex; gap:.75rem; flex-wrap:wrap; align-items:flex-end; margin-top:.75rem;">
                <div class="form-group" style="flex:1; min-width:200px; margin-bottom:0;">
                    <select name="studentId" class="form-control" required>
                        <option value="">-- Select --</option>
                        <option th:each="s : ${students}" th:value="${s.studentId}"
                                th:text="${s.studentName} + ' (' + ${s.department} + ')'"></option>
                    </select>
                </div>
                <button type="submit" class="btn btn-secondary" style="margin-bottom:0;">View Sent</button>
            </form>

            <form action="/requests/partnerships" method="get" style="display:flex; gap:.75rem; flex-wrap:wrap; align-items:flex-end; margin-top:.75rem;">
                <div class="form-group" style="flex:1; min-width:200px; margin-bottom:0;">
                    <select name="studentId" class="form-control" required>
                        <option value="">-- Select --</option>
                        <option th:each="s : ${students}" th:value="${s.studentId}"
                                th:text="${s.studentName} + ' (' + ${s.department} + ')'"></option>
                    </select>
                </div>
                <button type="submit" class="btn btn-info" style="margin-bottom:0;">View Partnerships</button>
            </form>
        </div>
    </div>
</div>
<footer>Study Buddy Matcher &mdash; DBMS Final Project</footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
