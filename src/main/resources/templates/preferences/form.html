<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Study Preference Form - Study Buddy Matcher</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<nav class="navbar">
    <a class="brand" href="/"><span>📚</span> Study Buddy Matcher</a>
    <div class="nav-links">
        <a href="/">Home</a><a href="/students">Students</a>
        <a href="/matches/search">Find Partners</a><a href="/requests/select">Requests</a>
    </div>
</nav>
<div class="container">
    <div class="page-header">
        <h1 th:text="${preference.preferenceId != 0} ? 'Edit Preference' : 'Add Study Preference'">Preference Form</h1>
        <a th:href="@{/preferences/student/{id}(id=${student.studentId})}" class="btn btn-outline btn-sm">← Back</a>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="card">
        <p style="color:#64748b; margin-bottom:1rem;">
            Student: <strong th:text="${student.studentName}"></strong>
        </p>

        <!-- Add form -->
        <form th:if="${preference.preferenceId == 0}"
              th:action="@{/preferences/add/{id}(id=${student.studentId})}"
              th:object="${preference}" method="post" novalidate>
            <th:block th:replace="~{preferences/form :: fields}"></th:block>
            <button type="submit" class="btn btn-primary">Add Preference</button>
        </form>

        <!-- Edit form -->
        <form th:unless="${preference.preferenceId == 0}"
              th:action="@{/preferences/edit/{id}(id=${preference.preferenceId})}"
              th:object="${preference}" method="post" novalidate>
            <th:block th:replace="~{preferences/form :: fields}"></th:block>
            <button type="submit" class="btn btn-primary">Save Changes</button>
        </form>
    </div>
</div>
<footer>Study Buddy Matcher &mdash; DBMS Final Project</footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>

<!-- Reusable fields fragment -->
<th:block th:fragment="fields" xmlns:th="http://www.thymeleaf.org">
    <div class="form-row">
        <div class="form-group">
            <label for="subjectName">Subject Name *</label>
            <input type="text" id="subjectName" th:field="*{subjectName}"
                   th:classappend="${#fields.hasErrors('subjectName')} ? 'is-invalid'"
                   class="form-control" placeholder="e.g. Data Structures"/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('subjectName')}" th:errors="*{subjectName}"></div>
        </div>
        <div class="form-group">
            <label for="skillLevel">Skill Level *</label>
            <select id="skillLevel" th:field="*{skillLevel}"
                    th:classappend="${#fields.hasErrors('skillLevel')} ? 'is-invalid'"
                    class="form-control">
                <option value="">-- Select --</option>
                <option th:each="sl : ${skillLevels}" th:value="${sl}" th:text="${sl}"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('skillLevel')}" th:errors="*{skillLevel}"></div>
        </div>
    </div>
    <div class="form-group">
        <label for="learningGoal">Learning Goal *</label>
        <input type="text" id="learningGoal" th:field="*{learningGoal}"
               th:classappend="${#fields.hasErrors('learningGoal')} ? 'is-invalid'"
               class="form-control" placeholder="e.g. Prepare for semester exam"/>
        <div class="invalid-feedback" th:if="${#fields.hasErrors('learningGoal')}" th:errors="*{learningGoal}"></div>
    </div>
    <div class="form-row">
        <div class="form-group">
            <label for="preferredTime">Preferred Study Time *</label>
            <select id="preferredTime" th:field="*{preferredTime}"
                    th:classappend="${#fields.hasErrors('preferredTime')} ? 'is-invalid'"
                    class="form-control">
                <option value="">-- Select --</option>
                <option th:each="t : ${timeOptions}" th:value="${t}" th:text="${t}"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('preferredTime')}" th:errors="*{preferredTime}"></div>
        </div>
        <div class="form-group">
            <label for="preferredLocation">Preferred Location *</label>
            <select id="preferredLocation" th:field="*{preferredLocation}"
                    th:classappend="${#fields.hasErrors('preferredLocation')} ? 'is-invalid'"
                    class="form-control">
                <option value="">-- Select --</option>
                <option th:each="loc : ${locations}" th:value="${loc}" th:text="${loc}"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('preferredLocation')}" th:errors="*{preferredLocation}"></div>
        </div>
    </div>
</th:block>
