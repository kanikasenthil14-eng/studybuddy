<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Study Preferences - Study Buddy Matcher</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<nav class="navbar">
    <a class="brand" href="/"><span>📚</span> Study Buddy Matcher</a>
    <div class="nav-links">
        <a href="/">Home</a><a href="/students">Students</a>
        <a href="/matches/search">Find Partners</a><a href="/requests/select">Requests</a>
    </div>
</nav>
<div class="container">
    <div class="page-header">
        <h1>Study Preferences — <span th:text="${student.studentName}"></span></h1>
        <div style="display:flex;gap:.5rem;">
            <a th:href="@{/preferences/add/{id}(id=${student.studentId})}" class="btn btn-primary btn-sm">+ Add Preference</a>
            <a th:href="@{/students/{id}(id=${student.studentId})}"        class="btn btn-outline btn-sm">← Profile</a>
        </div>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" data-auto-dismiss th:text="${successMessage}"></div>
    <div th:if="${errorMessage}"   class="alert alert-danger"  data-auto-dismiss th:text="${errorMessage}"></div>

    <div class="card" th:if="${preferences.isEmpty()}">
        <div class="empty-state">
            <div class="empty-icon">📋</div>
            <p>No study preferences added yet.</p>
            <a th:href="@{/preferences/add/{id}(id=${student.studentId})}" class="btn btn-primary">Add First Preference</a>
        </div>
    </div>

    <div class="card" th:unless="${preferences.isEmpty()}">
        <div class="table-wrap">
            <table>
                <thead>
                    <tr><th>Subject</th><th>Learning Goal</th><th>Skill Level</th><th>Time</th><th>Location</th><th>Actions</th></tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${preferences}">
                        <td th:text="${p.subjectName}"></td>
                        <td th:text="${p.learningGoal}"></td>
                        <td><span class="badge badge-accepted" th:text="${p.skillLevel}"></span></td>
                        <td th:text="${p.preferredTime}"></td>
                        <td th:text="${p.preferredLocation}"></td>
                        <td>
                            <a th:href="@{/preferences/edit/{id}(id=${p.preferenceId})}" class="btn btn-warning btn-sm">Edit</a>
                            <form th:action="@{/preferences/delete/{id}(id=${p.preferenceId})}" method="post"
                                  style="display:inline;" data-confirm="Delete this preference?">
                                <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<footer>Study Buddy Matcher &mdash; DBMS Final Project</footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
