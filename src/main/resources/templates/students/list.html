<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Students - Study Buddy Matcher</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<nav class="navbar">
    <a class="brand" href="/"><span>📚</span> Study Buddy Matcher</a>
    <div class="nav-links">
        <a href="/">Home</a><a href="/students">Students</a>
        <a href="/matches/search">Find Partners</a><a href="/requests/select">Requests</a>
    </div>
</nav>
<div class="container">
    <div class="page-header">
        <h1>All Students</h1>
        <a href="/students/register" class="btn btn-primary">+ Register Student</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" data-auto-dismiss th:text="${successMessage}"></div>
    <div th:if="${errorMessage}"   class="alert alert-danger"  data-auto-dismiss th:text="${errorMessage}"></div>

    <div class="card" th:if="${students.isEmpty()}">
        <div class="empty-state">
            <div class="empty-icon">👥</div>
            <p>No students registered yet.</p>
            <a href="/students/register" class="btn btn-primary">Register First Student</a>
        </div>
    </div>

    <div class="card" th:unless="${students.isEmpty()}">
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>#</th><th>Name</th><th>Email</th>
                        <th>Department</th><th>Year</th><th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="s : ${students}">
                        <td th:text="${s.studentId}"></td>
                        <td><a th:href="@{/students/{id}(id=${s.studentId})}" th:text="${s.studentName}"></a></td>
                        <td th:text="${s.email}"></td>
                        <td th:text="${s.department}"></td>
                        <td th:text="${s.yearOfStudy}"></td>
                        <td>
                            <a th:href="@{/students/{id}(id=${s.studentId})}"       class="btn btn-info btn-sm">View</a>
                            <a th:href="@{/students/{id}/edit(id=${s.studentId})}"  class="btn btn-warning btn-sm">Edit</a>
                            <a th:href="@{/preferences/student/{id}(id=${s.studentId})}" class="btn btn-secondary btn-sm">Prefs</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<footer>Study Buddy Matcher &mdash; DBMS Final Project</footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
