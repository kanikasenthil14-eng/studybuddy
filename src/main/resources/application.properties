# Application configuration
server.port=8080

# Database - uses environment variables with fallback defaults
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/study_buddy?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# Show SQL errors in logs but not to users
logging.level.org.springframework.jdbc=DEBUG
logging.level.com.studybuddy=DEBUG
